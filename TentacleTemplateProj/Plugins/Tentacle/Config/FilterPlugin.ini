[FilterPlugin]
; Include Spout DLLs for TentacleVideoTransport
/Binaries/Win64/*.dll

; Include everything under ThirdParty (Spout DLLs, headers, import libs, etc.)
/ThirdParty/...

; Include the Tentacle core's library for Embedded mode, which `just unreal::native`
; installs under Binaries/ThirdParty/TentacleCore/<platform> before packaging
/Binaries/ThirdParty/...

; Include plugin config (DefaultTentacle.ini holds CoreRedirects for SDK renames)
/Config/*.ini
