; --- tentacle-sdk 1.0.2: viewer-property `number` type split into `float` + `int` ---
; The ETclViewerPropertyType `Number` value was renamed to `Float` (a new `Int`
; value was also added). Repoint existing Blueprint enum pins.
+EnumRedirects=(OldName="ETclViewerPropertyType",ValueChanges=(("Number","Float")))

; --- Viewer-property accessors renamed to <Verb>Property_<Type> ---
; The typed property nodes moved the type into a suffix: GetFloatProperty ->
; GetProperty_Float, SetIntProperty -> SetProperty_Int, ToggleBoolProperty ->
; ToggleProperty_Bool, etc. Repoint the original Number nodes AND the later
; Float/Int/Bool/String nodes straight to their final names (UE does not reliably
; chain redirects, so every historical name resolves in a single hop).
+FunctionRedirects=(OldName="TclViewer.GetNumberProperty",NewName="TclViewer.GetProperty_Float")
+FunctionRedirects=(OldName="TclViewer.SetNumberProperty",NewName="TclViewer.SetProperty_Float")
+FunctionRedirects=(OldName="TclViewer.AddToNumberProperty",NewName="TclViewer.AddToProperty_Float")
+FunctionRedirects=(OldName="TclViewer.GetFloatProperty",NewName="TclViewer.GetProperty_Float")
+FunctionRedirects=(OldName="TclViewer.GetIntProperty",NewName="TclViewer.GetProperty_Int")
+FunctionRedirects=(OldName="TclViewer.GetBoolProperty",NewName="TclViewer.GetProperty_Bool")
+FunctionRedirects=(OldName="TclViewer.GetStringProperty",NewName="TclViewer.GetProperty_String")
+FunctionRedirects=(OldName="TclViewer.SetFloatProperty",NewName="TclViewer.SetProperty_Float")
+FunctionRedirects=(OldName="TclViewer.SetIntProperty",NewName="TclViewer.SetProperty_Int")
+FunctionRedirects=(OldName="TclViewer.SetBoolProperty",NewName="TclViewer.SetProperty_Bool")
+FunctionRedirects=(OldName="TclViewer.SetStringProperty",NewName="TclViewer.SetProperty_String")
+FunctionRedirects=(OldName="TclViewer.AddToFloatProperty",NewName="TclViewer.AddToProperty_Float")
+FunctionRedirects=(OldName="TclViewer.AddToIntProperty",NewName="TclViewer.AddToProperty_Int")
+FunctionRedirects=(OldName="TclViewer.ToggleBoolProperty",NewName="TclViewer.ToggleProperty_Bool")

; --- 1.1.0-alpha.5: the chat emoji's skin tones renamed (alpha.4 names) ---
; ETclEmojiVariant became ETclEmojiSkinTone with the same values, and the emoji's
; Variant array became SkinTones, still an array of that enum, so pins holding
; either reconnect under the new names.
+EnumRedirects=(OldName="ETclEmojiVariant",NewName="ETclEmojiSkinTone")
+PropertyRedirects=(OldName="TclChatMessageEmoji.Variant",NewName="TclChatMessageEmoji.SkinTones")
; No redirect for Hexcode -> CodePoints: the string became an array of strings,
; so a redirected pin would reconnect to the wrong type. A Blueprint that read
; Hexcode reports the missing member and needs the new CodePoints array instead.

; --- 1.2.0-alpha.3: App mode renamed Paired mode ---
; ETclTentacleMode's App value became Paired, the same value, so an actor's
; Editor Mode and Build Mode, and a Blueprint pin holding either, load as Paired.
+EnumRedirects=(OldName="ETclTentacleMode",ValueChanges=(("App","Paired")))
