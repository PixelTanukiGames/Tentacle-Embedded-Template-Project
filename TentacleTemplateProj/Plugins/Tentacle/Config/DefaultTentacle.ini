+ClassRedirects=(OldName="TclTwitchEvent_StreamOnline",NewName="TclStreamEvent_Twitch_StreamOnline")
+ClassRedirects=(OldName="TclTwitchEvent_Subscription",NewName="TclStreamEvent_Twitch_Subscription")
