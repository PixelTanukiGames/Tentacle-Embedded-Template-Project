+PropertyRedirects=(OldName="TclCustomControlComponent_Color.OnValueChangedFromWeb",NewName="TclCustomControlComponent_Color.OnValueChangedFromApp")
+PropertyRedirects=(OldName="TclCustomControlComponent_Number.OnValueChangedFromWeb",NewName="TclCustomControlComponent_Number.OnValueChangedFromApp")
+PropertyRedirects=(OldName="TclCustomControlComponent_Select.OnValueChangedFromWeb",NewName="TclCustomControlComponent_Select.OnValueChangedFromApp")
+PropertyRedirects=(OldName="TclCustomControlComponent_Slider.OnValueChangedFromWeb",NewName="TclCustomControlComponent_Slider.OnValueChangedFromApp")
