[CoreRedirects]
; (tentacle-sdk below is the former name of the tentacle-web npm package; the
; version references predate the rename and are kept as historical provenance.)
; tentacle-sdk 1.0.0-alpha rename: <Platform>Event/<Platform>ChatMessage -> StreamEvent_<Platform>/StreamChatMessage_<Platform>

; --- Stream base classes ---
+ClassRedirects=(OldName="TclStreamEvent",NewName="TclStreamEventBase")

; --- Chat message classes ---
; In tentacle-sdk 1.0.0-alpha.2, chat messages folded into stream-event variants
; (TclStreamEvent_Twitch_ChatMessage / TclStreamEvent_Kick_ChatMessage). Their
; cross-platform $-prefixed fields now live on the synthesized
; TclStreamEvent_Anywhere_ChatMessage class. Repoint legacy chat-message types
; to whichever destination preserves the most usage:
;   - Per-platform message classes -> per-platform stream-event variants
;   - The cross-platform "Base" / "Anywhere" message class -> Anywhere_ChatMessage
+ClassRedirects=(OldName="TclTwitchChatMessage",NewName="TclStreamEvent_Twitch_ChatMessage")
+ClassRedirects=(OldName="TclStreamChatMessage_Twitch",NewName="TclStreamEvent_Twitch_ChatMessage")
+ClassRedirects=(OldName="TclKickChatMessage",NewName="TclStreamEvent_Kick_ChatMessage")
+ClassRedirects=(OldName="TclStreamChatMessage_Kick",NewName="TclStreamEvent_Kick_ChatMessage")
+ClassRedirects=(OldName="TclStreamChatMessage",NewName="TclStreamEvent_Anywhere_ChatMessage")
+ClassRedirects=(OldName="TclStreamChatMessageBase",NewName="TclStreamEvent_Anywhere_ChatMessage")

; --- Twitch event base + enum ---
+ClassRedirects=(OldName="TclTwitchEvent",NewName="TclStreamEvent_Twitch_Base")
+ClassRedirects=(OldName="TclTwitchEventBase",NewName="TclStreamEvent_Twitch_Base")
+EnumRedirects=(OldName="TclTwitchEventType",NewName="TclStreamEventType_Twitch")

